<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Despensa</title>

    <link rel="manifest" href="manifest.webmanifest">
    
    <meta name="theme-color" content="#FFDAB9">
    
    <link rel="apple-touch-icon" href="icon-192.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* --- NOVO: Animação de Carregamento --- */
        @keyframes spin {
            100% {
                transform: rotate(360deg);
            }
        }
        .spinning-peach {
            display: inline-block;
            animation: spin 1s linear infinite;
        }

        /* --- ESTILO GERAL (TEMA PÊSSEGO) --- */
        body {
            font-family: 'Nunito', sans-serif;
            background-color: #FFF7E8; /* Creme */
            color: #5D4037; /* Marrom Escuro */
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        h1 {
            width: 100%;
            font-family: 'Fredoka One', cursive; /* Título Fofo */
            font-weight: 400; /* Fredoka One já é bold */
            font-size: 2.5em;
            margin-bottom: 30px;
            color: #FF7A59; /* Pêssego Principal */
            text-shadow: 0 2px 4px rgba(93, 64, 55, 0.2);
            text-align: center;
        }

        /* --- NAVEGAÇÃO POR ABAS --- */
        .nav-tabs {
            width: 100%;
            max-width: 500px;
            display: flex;
            margin-bottom: 25px;
            background-color: #EFEBE9; /* Bege Claro (Marrom de apoio) */
            border-radius: 50px; /* BORDAS ARREDONDADAS */
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
            padding: 5px;
        }
        .nav-button {
            flex: 1;
            padding: 15px 10px;
            font-size: 1.1em;
            font-weight: 700;
            color: #795548; /* Marrom Médio */
            background-color: transparent;
            border: none;
            border-radius: 50px; /* BORDAS ARREDONDADAS */
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
        }
        .nav-button.active {
            color: white;
            background-color: #FF7A59; /* Pêssego Principal */
            text-shadow: none;
            box-shadow: 0 2px 8px rgba(255, 122, 89, 0.4);
        }

        /* --- CONTÊINER DAS ABAS --- */
        .tab-content { width: 100%; max-width: 500px; }
        .tab-pane { width: 100%; display: flex; flex-direction: column; align-items: center; }
        .tab-pane.hidden { display: none; }

        /* --- SEÇÃO DO SCANNER --- */
        #leitor {
            width: 100%;
            max-width: 500px;
            border: 3px solid #FFB7B2; /* Pêssego Claro */
            border-radius: 24px; /* BORDAS BEM MAIS ARREDONDADAS */
            overflow: hidden;
            margin-bottom: 25px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            background-color: #EFEBE9; /* Bege Claro */
        }
        /* Botão principal de Ação (Adicionar/Remover) */
        #modo-btn {
            width: 100%;
            max-width: 500px;
            padding: 20px;
            font-size: 1.3em;
            font-family: 'Nunito', sans-serif;
            font-weight: 700;
            border: none;
            border-radius: 50px; /* BORDAS ARREDONDADAS */
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            text-transform: uppercase;
        }
        /* Mensagem de feedback */
        #status-msg {
            margin-top: 10px;
            font-size: 1.1em;
            color: #5D4037; /* Marrom Escuro */
            height: 30px; 
            text-align: center;
            font-weight: 600;
            transition: color 0.3s ease;
        }
        
        /* Cores dos botões e status */
        .add-mode {
            background: linear-gradient(135deg, #FF7A59 0%, #FFB7B2 100%); /* Pêssego -> Rosa */
            color: white;
        }
        .add-mode:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(255, 122, 89, 0.4); }
        .remove-mode {
            background: linear-gradient(135deg, #FFB7B2 0%, #FF7A59 100%); /* Rosa -> Pêssego */
            color: white;
        }
        .remove-mode:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(255, 122, 89, 0.4); }

        #status-msg.success {
            color: #00C896; /* Verde Menta */
        }
        #status-msg.error {
            color: #E94E79; /* Rosa/Vermelho (Erro) */
        }

        /* --- ABA "LISTA DE COMPRAS" --- */
        #secao-lista p {
            font-size: 1.1em;
            text-align: center;
            margin-bottom: 25px;
        }
        .lista-btn {
            width: 100%;
            max-width: 500px;
            padding: 20px;
            font-size: 1.3em;
            font-family: 'Nunito', sans-serif;
            font-weight: 700;
            border: none;
            border-radius: 50px; /* BORDAS ARREDONDADAS */
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            color: white;
            text-decoration: none; 
            text-align: center;
            box-sizing: border-box; 
            text-transform: uppercase;
        }
        .lista-btn:hover { transform: translateY(-2px); }
        
        /* COR NOVA: Botão Sincronizar (Pêssego) */
        #btn-sincronizar-notion {
            background: linear-gradient(135deg, #FF7A59 0%, #FFB7B2 100%);
            box-shadow: 0 6px 20px rgba(255, 122, 89, 0.4);
        }

        /* COR NOVA: Botão Ver Lista (Marrom Escuro) */
        #btn-ver-notion {
             background: #5D4037; /* Marrom Escuro */
        }

        /* COR NOVA: Botão Instalar (Verde Menta) */
        #btn-instalar-pwa {
            background: linear-gradient(135deg, #00C896 0%, #00BFA5 100%);
            margin-top: 10px;
        }

        /* --- CAMPO DE SENHA --- */
        #secret-password-input {
            width: 60%;
            max-width: 500px;
            padding: 15px 20px;
            font-size: 1em;
            font-family: 'Nunito', sans-serif;
            border: 2px solid #EFEBE9; /* Bege Claro */
            border-radius: 50px; /* BORDAS ARREDONDADAS */
            background-color: #EFEBE9;
            color: #5D4037;
            box-shadow: none;
            transition: all 0.3s ease;
            margin-top: 15px;
            text-align: center;
        }
        #secret-password-input:focus {
            outline: none;
            border-color: #FFB7B2; /* Pêssego Claro */
            background-color: #FFF7E8;
            box-shadow: 0 0 10px rgba(255, 122, 89, 0.2);
        }

        /* --- MODAL DE MAPEAMENTO --- */
        .modal-overlay {
            /* ... (sem mudanças, mas poderia ser estilizado) ... */
            display: none;
            position: fixed;
            z-index: 100;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(93, 64, 55, 0.6); /* Fundo Marrom translúcido */
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            align-items: center;
            justify-content: center;
        }
        .modal-content {
            background-color: #FFF7E8; /* Creme */
            margin: auto;
            padding: 25px;
            border: none;
            border-radius: 24px; /* BORDAS BEM MAIS ARREDONDADAS */
            width: 90%;
            max-width: 400px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .modal-content h2 { margin: 0; color: #FF7A59; font-size: 1.4em; text-align: center; }
        .modal-content p { margin: 0; font-size: 0.9em; color: #5D4037; text-align: center; }
        #mapping-barcode {
            font-family: 'Courier New', Courier, monospace;
            font-size: 1.1em;
            color: #FF7A59;
            background-color: #EFEBE9;
            padding: 10px;
            border-radius: 12px;
            text-align: center;
            word-break: break-all;
        }
        #mapping-item-list {
            width: 100%;
            padding: 15px;
            font-size: 1em;
            font-family: 'Nunito', sans-serif;
            border: 2px solid #EFEBE9;
            border-radius: 12px;
            background-color: #EFEBE9;
            color: #5D4037;
        }
        #mapping-item-list:focus { outline: none; border-color: #FFB7B2; }
        .modal-buttons { display: flex; gap: 10px; margin-top: 10px; }
        .modal-buttons button {
            flex: 1;
            padding: 15px;
            font-size: 1.1em;
            font-family: 'Nunito', sans-serif;
            font-weight: 700;
            border: none;
            border-radius: 50px; /* BORDAS ARREDONDADAS */
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
        }
        #mapping-associate-btn {
            background: linear-gradient(135deg, #FF7A59 0%, #FFB7B2 100%);
            color: white;
        }
        #mapping-associate-btn:hover { opacity: 0.9; transform: translateY(-2px); }
        #mapping-cancel-btn { background-color: #EFEBE9; color: #795548; }
        #mapping-cancel-btn:hover { background-color: #D7CCC8; }
        
    </style>
</head>
<body>

    <h1>Residência Pêssego 🍑</h1>

    <nav class="nav-tabs">
        <button class="nav-button active" id="nav-scanner">Scanner</button>
        <button class="nav-button" id="nav-lista">Lista de Compras</button>
    </nav>

    <div class="tab-content">

        <section id="secao-scanner" class="tab-pane">
            <div id="leitor"></div>
            <button id="modo-btn" class="add-mode">ADICIONAR</button>
            <div id="status-msg">Aponte para um código de barras</div>
        </section>

        <section id="secao-lista" class="tab-pane hidden">
            <p>Sincronize sua "Lista de Compras" da planilha com o Notion.</p>
            
            <button id="btn-sincronizar-notion" class="lista-btn">
                Sincronizar Lista
            </button>
            
            <a id="btn-ver-notion" class="lista-btn" href="https://www.notion.so/Lista-de-Compras-1-2adc5ed80386805cabfad46c1a929379" target="_blank">
            Ver Lista no Notion
            </a>

            <button id="btn-instalar-pwa" class="lista-btn" style="display: none;">
                Instalar Aplicativo
            </button>

        </section>

    </div>

    <input type="password" id="secret-password-input" placeholder="Senha">

    <div id="mapping-modal" class="modal-overlay">
        <div class="modal-content">
            <h2>Produto não reconhecido!</h2>
            <p>Este é um item novo. A qual categoria o código abaixo pertence?</p>
            <div id="mapping-barcode">[código de barras]</div>
            <p>Selecione o item genérico:</p>
            <select id="mapping-item-list">
                <option value="">Carregando itens...</option>
            </select>
            <div class="modal-buttons">
                <button id="mapping-cancel-btn">Cancelar</button>
                <button id="mapping-associate-btn">Associar</button>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <script src="app.js"></script>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./serviceworker.js')
                    .then(registration => {
                        console.log('ServiceWorker registrado com sucesso:', registration.scope);
                    })
                    .catch(error => {
                        console.log('Falha ao registrar ServiceWorker:', error);
                    });
            });
        }
    </script>
    
</body>
</html>
