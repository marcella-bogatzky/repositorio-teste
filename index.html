<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Despensa</title>

    <link rel="manifest" href="manifest.webmanifest">
    
    <meta name="theme-color" content="#FFDAB9">
    
    <link rel="apple-touch-icon" href="icon-192.png">

    <style>
        /* --- ESTILO GERAL --- */
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #2c2c2c;
            color: #f0f0f0;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        h1 {
            width: 100%;
            font-weight: 600;
            font-size: 2em; /* Corrigido de 2.em para 2em */
            margin-bottom: 30px;
            color: #FFDAB9; /* Pêssego */
            text-shadow: 0 0 15px rgba(255, 218, 185, 0.4);
            text-align: center;
        }

        /* --- NOVO: NAVEGAÇÃO POR ABAS --- */
        .nav-tabs {
            width: 100%;
            max-width: 500px;
            display: flex;
            margin-bottom: 25px;
            background-color: #3a3a3a;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            overflow: hidden;
        }
        .nav-button {
            flex: 1;
            padding: 18px 10px;
            font-size: 1.1em;
            font-weight: 600;
            color: #aaa;
            background-color: transparent;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
        }
        .nav-button.active {
            color: #FFDAB9;
            background-color: #4a4a4a;
            text-shadow: 0 0 10px rgba(255, 218, 185, 0.3);
        }

        /* --- NOVO: CONTÊINER DAS ABAS --- */
        .tab-content {
            width: 100%;
            max-width: 500px;
        }
        .tab-pane {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .tab-pane.hidden {
            display: none;
        }

        /* --- ESTILOS ANTIGOS (AGORA DENTRO DAS ABAS) --- */
        
        /* "Janela" da câmera */
        #leitor {
            width: 100%;
            max-width: 500px;
            border: 2px solid #555;
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 25px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
            background-color: #3a3a3a;
        }
        /* Botão principal de Ação */
        #modo-btn {
            width: 100%;
            max-width: 500px;
            padding: 22px;
            font-size: 1.3em;
            font-weight: 600;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.1);
        }
        /* Mensagem de feedback */
        #status-msg {
            margin-top: 10px;
            font-size: 1.1em;
            color: #f0f0f0;
            height: 30px; /* Altura fixa para não "pular" */
            text-align: center;
            font-weight: 400;
            transition: color 0.3s ease;
        }
        
        /* Classes que o JavaScript vai adicionar ao botão */
        .add-mode {
            background: linear-gradient(135deg, #FF9A8B 0%, #FF6A88 100%);
            color: white;
        }
        .add-mode:hover {
            transform: translateY(-2px);
        }
        .remove-mode {
            background: linear-gradient(135deg, #FF5F6D 0%, #FFC371 100%);
            color: white;
        }
        .remove-mode:hover {
            transform: translateY(-2px);
        }
        /* Classes para as cores das mensagens de status */
        #status-msg.success {
            color: #82E0AA; /* Verde claro */
        }
        #status-msg.error {
            color: #F1948A; /* Vermelho claro */
        }

        /* Estilo para o campo de senha (agora usado nas duas abas) */
        #secret-password-input {
            width: 60%;
            max-width: 500px;
            padding: 15px 20px;
            font-size: 1em;
            border: 1px solid #555;
            border-radius: 10px;
            background-color: #3a3a3a;
            color: #f0f0f0;
            box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.4);
            transition: border-color 0.3s ease;
            margin-top: 15px; /* Adicionado espaço acima */
        }
        #secret-password-input:focus {
            outline: none;
            border-color: #FFDAB9; /* Borda pêssego no foco */
            box-shadow: inset 0 1px 5px rgba(0, 0, 0, 0.4), 0 0 10px rgba(255, 218, 185, 0.5);
        }

        /* --- NOVO: ESTILO DA ABA "LISTA DE COMPRAS" --- */
        #secao-lista p {
            font-size: 1.1em;
            text-align: center;
            margin-bottom: 25px;
        }
        /* Botão genérico para a nova aba (copia estilo do #modo-btn) */
        .lista-btn {
            width: 100%;
            max-width: 500px;
            padding: 22px;
            font-size: 1.3em;
            font-weight: 600;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.1);
            color: white;
            text-decoration: none; /* Para o link <a> */
            text-align: center;
            box-sizing: border-box; /* Para o link <a> */
        }
        
        /* Cor específica Botão Sincronizar (azulado) */
        #btn-sincronizar-notion {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        }
        #btn-sincronizar-notion:hover {
             transform: translateY(-2px);
        }

        /* Cor específica Botão Ver Lista (cinza escuro) */
        #btn-ver-notion {
             background: linear-gradient(135deg, #6c757d 0%, #495057 100%);
        }
        #btn-ver-notion:hover {
             transform: translateY(-2px);
        }


        /* --- Estilo do Modal de Mapeamento (Sem alterações) --- */
        .modal-overlay {
            display: none;
            position: fixed;
            z-index: 100;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            align-items: center;
            justify-content: center;
        }
        .modal-content {
            background-color: #3a3a3a;
            margin: auto;
            padding: 25px;
            border: 1px solid #555;
            border-radius: 12px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .modal-content h2 { margin: 0; color: #FFDAB9; font-size: 1.4em; text-align: center; }
        .modal-content p { margin: 0; font-size: 0.9em; color: #f0f0f0; text-align: center; }
        #mapping-barcode {
            font-family: 'Courier New', Courier, monospace;
            font-size: 1.1em;
            color: #FFC371;
            background-color: #2c2c2c;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            word-break: break-all;
        }
        #mapping-item-list {
            width: 100%;
            padding: 15px;
            font-size: 1em;
            font-family: 'Montserrat', sans-serif;
            border: 1px solid #555;
            border-radius: 10px;
            background-color: #4a4a4a;
            color: #f0f0f0;
        }
        #mapping-item-list:focus { outline: none; border-color: #FFDAB9; }
        .modal-buttons { display: flex; gap: 10px; margin-top: 10px; }
        .modal-buttons button {
            flex: 1;
            padding: 15px;
            font-size: 1.1em;
            font-weight: 600;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        #mapping-associate-btn {
            background: linear-gradient(135deg, #FF9A8B 0%, #FF6A88 100%);
            color: white;
        }
        #mapping-associate-btn:hover { opacity: 0.9; transform: translateY(-2px); }
        #mapping-cancel-btn { background-color: #666; color: #f0f0f0; }
        #mapping-cancel-btn:hover { background-color: #777; }

        /* Cor específica Botão Instalar (verde) */
        #btn-instalar-pwa {
            background: linear-gradient(135deg, #28a745 0%, #218838 100%);
            margin-top: 10px; /* Espaço extra */
        }
        #btn-instalar-pwa:hover {
            transform: translateY(-2px);
        }
        
    </style>
</head>
<body>

    <h1>Residência Pêssego 🍑</h1>

    <nav class="nav-tabs">
        <button class="nav-button active" id="nav-scanner">Scanner</button>
        <button class="nav-button" id="nav-lista">Lista de Compras</button>
    </nav>

    <div class="tab-content">

        <section id="secao-scanner" class="tab-pane">
            <div id="leitor"></div>
            <button id="modo-btn" class="add-mode">ADICIONAR</button>
            <div id="status-msg">Aponte para um código de barras</div>
        </section>

        <section id="secao-lista" class="tab-pane hidden">
            <p>Sincronize sua "Lista de Compras" da planilha com o Notion.</p>
            
            <button id="btn-sincronizar-notion" class="lista-btn">
                Sincronizar Lista Agora
            </button>
            
            <a id="btn-ver-notion" class="lista-btn" href="https://www.notion.so/Lista-de-Compras-1-2adc5ed80386805cabfad46c1a929379" target="_blank">
            Ver Lista no Notion
            </a>

            <button id="btn-instalar-pwa" class="lista-btn" style="display: none;">
                Instalar Aplicativo
            </button>

        </section>

    </div>

    <input type="password" id="secret-password-input" placeholder="Senha">

    <div id="mapping-modal" class="modal-overlay">
        <div class="modal-content">
            <h2>Produto não reconhecido!</h2>
            <p>Este é um item novo. A qual categoria o código abaixo pertence?</p>
            <div id="mapping-barcode">[código de barras]</div>
            <p>Selecione o item genérico:</p>
            <select id="mapping-item-list">
                <option value="">Carregando itens...</option>
            </select>
            <div class="modal-buttons">
                <button id="mapping-cancel-btn">Cancelar</button>
                <button id="mapping-associate-btn">Associar</button>
            </div>
        </div>
    </div>

    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <script src="app.js"></script>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./serviceworker.js')
                    .then(registration => {
                        console.log('ServiceWorker registrado com sucesso:', registration.scope);
                    })
                    .catch(error => {
                        console.log('Falha ao registrar ServiceWorker:', error);
                    });
            });
        }
    </script>
    
</body>
</html>
